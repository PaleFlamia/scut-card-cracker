name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            out: scc-linux
          - os: windows-latest
            out: scc-windows.exe
          - os: macos-latest
            out: scc-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: gcc scc.c -O2 -o ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
